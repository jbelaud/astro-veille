name: Veille Astro

on:
  schedule:
    # GitHub Actions travaille en UTC et ne gère pas l'heure d'été.
    # 9h à Paris = 8h UTC l'hiver (UTC+1) et 7h UTC l'été (UTC+2).
    # Les deux déclencheurs tournent donc chaque lundi ; l'étape "Vérifier l'heure"
    # arrête celui qui tombe à la mauvaise heure.
    - cron: "0 7 * * 1"
    - cron: "0 8 * * 1"
  workflow_dispatch: # lancement à la main depuis l'onglet Actions (sans test d'heure)

permissions:
  contents: write # nécessaire pour committer state.json

# Évite que deux exécutions se chevauchent
concurrency:
  group: veille-astro
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Étape de garde : seulement pour les lancements planifiés.
      - name: Vérifier qu'il est 9h à Paris
        id: heure
        if: github.event_name == 'schedule'
        run: python veille.py --verifier-heure

      - name: Installer les dépendances
        if: github.event_name != 'schedule' || steps.heure.outputs.lancer == 'true'
        run: pip install -r requirements.txt

      - name: Lancer la veille
        if: github.event_name != 'schedule' || steps.heure.outputs.lancer == 'true'
        run: python veille.py
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Jeton fourni automatiquement par GitHub (aucun secret à créer).
          # Il sert seulement à avoir une limite de requêtes plus confortable sur l'API.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enregistrer state.json
        if: success() && (github.event_name != 'schedule' || steps.heure.outputs.lancer == 'true')
        run: |
          git config user.name "astro-veille-bot"
          git config user.email "astro-veille-bot@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "state.json inchangé"
          else
            git commit -m "Mise à jour de state.json"
            git push
          fi
